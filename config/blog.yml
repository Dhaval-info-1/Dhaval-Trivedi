    faq:
      - question: "What are the key components of transformer architecture?"
        answer: "The key components include multi-head self-attention mechanisms, position-wise feed-forward networks, layer normalization and residual connections, and positional encodings."
      - question: "How does self-attention mechanism work in transformers?"
        answer: "Self-attention mechanism computes attention scores using queries, keys, and values through the formula Attention(Q, K, V) = softmax(QK^T/√d_k)V, allowing the model to weigh the importance of different parts of the input sequence dynamically."
      - question: "What is multi-head attention in transformer models?"
        answer: "Multi-head attention allows the model to attend to information from different representation subspaces. It typically uses 8-16 attention heads, enabling parallel processing and learning different aspects of relationships between tokens."

